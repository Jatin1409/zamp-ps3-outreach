# Render Blueprint: one web service (API + SSE + frontend + in-process job worker) and one Postgres database.
services:
  - type: web
    name: outreach-desk
    runtime: docker
    plan: free               # chosen by owner; sleeps after 15 min idle (~50 s cold start) - warm it before a demo
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: outreach-desk-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: LLM_MODEL_FAST
        value: claude-opus-5-5
      - key: RUNS_PER_HOUR_PER_CLIENT
        value: "15"
      - key: RUNS_PER_DAY_GLOBAL
        value: "150"
databases:
  - name: outreach-desk-db
    plan: free               # free Postgres expires after 30 days
    region: oregon
